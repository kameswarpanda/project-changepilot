name: ChangePilot CI/CD — Test, Build & Deploy to Google Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'project-changepilot' }}
  REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
  SERVICE_NAME: changepilot
  IMAGE_NAME: gcr.io/${{ secrets.GCP_PROJECT_ID || 'project-changepilot' }}/changepilot:${{ github.sha }}

jobs:
  test:
    name: Run Automated Safety Gates & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio pytest-cov

      - name: Execute Backend Safety Gate Tests (58 Tests)
        run: |
          python -m pytest backend/tests/ -v

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install & Build Angular Frontend
        working-directory: ./frontend
        run: |
          npm ci --legacy-peer-deps || npm install
          npm run build -- --configuration production

  deploy:
    name: Build & Deploy to Google Cloud Run
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        if: "${{ secrets.GCP_SA_KEY != '' }}"
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: "${{ secrets.GCP_SA_KEY != '' }}"
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker for Google Container Registry
        if: "${{ secrets.GCP_SA_KEY != '' }}"
        run: |
          gcloud auth configure-docker --quiet

      - name: Build & Push Unified Multi-Stage Docker Image
        if: "${{ secrets.GCP_SA_KEY != '' }}"
        run: |
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME

      - name: Deploy Container to Google Cloud Run
        if: "${{ secrets.GCP_SA_KEY != '' }}"
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image $IMAGE_NAME \
            --platform managed \
            --region $REGION \
            --allow-unauthenticated \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --set-env-vars "APP_ENV=production,GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${REGION},GEMINI_MODEL=gemini-2.5-flash,JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY || 'changepilot-secure-jwt-production-secret-key-2026' }},GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID || '189200132893-bigtbq45b7hupbhqpg44u517g42svhrm.apps.googleusercontent.com' }},GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET || '' }},GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN || '' }}"

      - name: Output Live Cloud Run URL
        if: "${{ secrets.GCP_SA_KEY != '' }}"
        run: |
          echo "=========================================================="
          echo "🎉 ChangePilot is LIVE on Google Cloud Run!"
          gcloud run services describe $SERVICE_NAME --platform managed --region $REGION --format 'value(status.url)'
          echo "=========================================================="
