steps:
  # 1. Build Multi-Stage Docker Container (Frontend + Backend)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/changepilot:$COMMIT_SHA', '.']

  # 2. Push Image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/changepilot:$COMMIT_SHA']

  # 3. Deploy to Google Cloud Run with Zero Downtime
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'changepilot'
      - '--image'
      - 'gcr.io/$PROJECT_ID/changepilot:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--set-env-vars'
      - 'APP_ENV=production,GOOGLE_GENAI_USE_VERTEXAI=true,GEMINI_MODEL=gemini-2.5-flash'

images:
  - 'gcr.io/$PROJECT_ID/changepilot:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
