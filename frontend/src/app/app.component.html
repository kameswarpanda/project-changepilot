<!-- Global Toast & Notification Popups Container (Visible across all screens) -->
<app-toast-container></app-toast-container>

<!-- 1. Unauthenticated Login / Sign-Up Gate -->
<app-auth-page *ngIf="!(authService.isAuthenticated$ | async)"></app-auth-page>

<!-- 2. Authenticated ChangePilot Application Shell -->
<div *ngIf="(authService.isAuthenticated$ | async)" class="flex h-screen overflow-hidden bg-[#0B0E14] text-[#e1e2eb]">
  <!-- Left Sidebar Component -->
  <app-sidebar></app-sidebar>

  <!-- Main Content Wrapper -->
  <div class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">
    <!-- Topbar Component -->
    <app-topbar></app-topbar>

    <!-- Dynamic View Containers -->
    <main class="flex-1 overflow-y-auto bg-[#0B0E14] relative">
      <app-dashboard *ngIf="(state.activeNav$ | async) === 'dashboard'"></app-dashboard>
      <app-change-requests *ngIf="(state.activeNav$ | async) === 'requests'"></app-change-requests>
      <app-pipelines *ngIf="(state.activeNav$ | async) === 'pipelines'"></app-pipelines>
      <app-change-result *ngIf="(state.activeNav$ | async) === 'results'"></app-change-result>
      <app-repositories *ngIf="(state.activeNav$ | async) === 'repositories'"></app-repositories>
      <app-audit-logs *ngIf="(state.activeNav$ | async) === 'audit'"></app-audit-logs>
    </main>
  </div>

  <!-- Mobile Navigation Drawer Overlay Backdrop -->
  <div *ngIf="(state.isMobileSidebarOpen$ | async)" 
       (click)="state.closeMobileSidebar()" 
       class="md:hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-40 transition-opacity">
  </div>

  <!-- Modals (if triggered) -->
  <app-report-modal></app-report-modal>
  <app-new-request-modal></app-new-request-modal>
  <app-confirm-pipeline-modal></app-confirm-pipeline-modal>
</div>
