<div class="view-container">
  <div class="view-header">
    <div>
      <h1 class="view-title">Connected Repositories</h1>
      <p class="view-subtitle">Deterministic topology analysis, test frameworks, and sandbox isolation.</p>
    </div>
    <button (click)="state.inspectRepository()" class="btn-primary-gradient px-4 py-2 text-xs">
      <span>+ Analyze Repository</span>
    </button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div *ngFor="let repo of (filteredRepos$ | async)" class="glass-card p-5 flex flex-col justify-between">
      <div>
        <div class="flex items-center justify-between mb-3">
          <span class="font-mono text-sm font-bold text-white">{{ repo.name }}</span>
          <span class="badge-success badge-pill">{{ repo.status }}</span>
        </div>
        <p class="text-xs text-slate-400 mb-4">Location: <code class="font-mono text-slate-300">{{ repo.path }}</code></p>

        <div class="space-y-1.5 text-xs text-slate-300">
          <div class="flex justify-between">
            <span class="text-slate-400">Language:</span>
            <strong>{{ repo.language }}</strong>
          </div>
          <div class="flex justify-between">
            <span class="text-slate-400">Test Runner:</span>
            <code class="font-mono text-indigo-300">{{ repo.testRunner }}</code>
          </div>
          <div class="flex justify-between">
            <span class="text-slate-400">Files:</span>
            <span>{{ repo.fileCount }} files</span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-2 mt-6 pt-3 border-t border-slate-800">
        <button (click)="inspect(repo)" class="btn-secondary-outline flex-1 py-1.5 text-xs cursor-pointer">
          Inspect
        </button>
        <button (click)="select(repo)" class="btn-primary-gradient flex-1 py-1.5 text-xs cursor-pointer">
          Select
        </button>
      </div>
    </div>
  </div>
</div>
