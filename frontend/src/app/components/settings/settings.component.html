<div class="view-container">
  <div>
    <h1 class="view-title">Platform Settings</h1>
    <p class="view-subtitle">Configure AI model endpoints, execution limits, and security constraints.</p>
  </div>

  <div class="glass-card p-6 space-y-6 max-w-2xl text-xs">
    <!-- AI Mode Configuration -->
    <div>
      <h3 class="text-sm font-bold text-white mb-2">Vertex AI & Model Engine</h3>
      <div class="space-y-3 bg-slate-900/80 p-4 rounded-lg border border-slate-800">
        <label class="flex items-center justify-between cursor-pointer">
          <span class="text-slate-300">Enable Google Vertex AI (ADC)</span>
          <input type="checkbox" [(ngModel)]="state.appSettings.vertexAiEnabled" class="rounded">
        </label>
        <div>
          <span class="text-slate-400 block mb-1">GCP Project ID</span>
          <input type="text" [(ngModel)]="state.appSettings.gcpProject" class="modal-input font-mono">
        </div>
      </div>
    </div>

    <!-- Security & Execution Limits -->
    <div>
      <h3 class="text-sm font-bold text-white mb-2">Execution & Safety Boundaries</h3>
      <div class="space-y-3 bg-slate-900/80 p-4 rounded-lg border border-slate-800">
        <div>
          <div class="flex justify-between mb-1">
            <span class="text-slate-300">Test Execution Hard Timeout</span>
            <span class="font-mono text-indigo-400 font-bold">{{ state.appSettings.executionTimeoutSec }}s</span>
          </div>
          <input type="range" min="10" max="120" step="5" [(ngModel)]="state.appSettings.executionTimeoutSec" class="w-full">
        </div>

        <label class="flex items-center justify-between cursor-pointer pt-2">
          <span class="text-slate-300">Enforce Path Confinement & Sandbox Isolation</span>
          <input type="checkbox" [(ngModel)]="state.appSettings.sandboxIsolation" checked disabled>
        </label>
      </div>
    </div>

    <!-- Action Button -->
    <div class="pt-2 flex justify-end">
      <button (click)="save()" class="btn-primary-gradient px-5 py-2 cursor-pointer">
        Save Changes
      </button>
    </div>
  </div>
</div>
