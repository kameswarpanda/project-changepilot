<div class="view-container">
  <div class="view-header">
    <div>
      <h1 class="view-title">Change Requests</h1>
      <p class="view-subtitle">Manage, create, and trigger autonomous code changes.</p>
    </div>
    <button (click)="openNewRequest()" class="btn-primary-gradient px-4 py-2 text-xs flex items-center gap-2">
      <span>+ New Change Request</span>
    </button>
  </div>

  <div class="glass-card p-5 space-y-4">
    <div class="overflow-x-auto">
      <table class="w-full text-xs text-left">
        <thead class="text-slate-400 border-b border-slate-800 uppercase font-semibold">
          <tr>
            <th class="py-3 px-3">Story ID</th>
            <th class="py-3 px-3">Title</th>
            <th class="py-3 px-3">Status</th>
            <th class="py-3 px-3">Duration</th>
            <th class="py-3 px-3">Branch</th>
            <th class="py-3 px-3 text-right">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-800/60">
          <tr *ngFor="let r of (filteredRuns$ | async)" class="table-row-hover">
            <td class="py-3 px-3 font-mono font-bold text-indigo-400">{{ r.storyId }}</td>
            <td class="py-3 px-3 font-medium text-slate-200">{{ r.title }}</td>
            <td class="py-3 px-3">
              <span class="badge-success badge-pill">{{ r.status }}</span>
            </td>
            <td class="py-3 px-3 font-mono text-slate-300">{{ r.duration }}</td>
            <td class="py-3 px-3 font-mono text-slate-400">{{ r.branch || 'changepilot/' + r.storyId }}</td>
            <td class="py-3 px-3 text-right space-x-2">
              <button (click)="inspectRun(r)" class="text-indigo-400 hover:underline cursor-pointer">Inspect</button>
              <button (click)="reRun(r)" class="text-emerald-400 hover:underline cursor-pointer">Re-run</button>
            </td>
          </tr>

          <tr *ngIf="(filteredRuns$ | async)?.length === 0">
            <td colspan="6" class="py-8 text-center text-slate-500 italic">
              No matching change requests found.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
