<div class="glass-card dashboard-widget-card">
  <div class="widget-header">
    <h3 class="widget-title">Change Request</h3>
    <div class="flex items-center gap-1.5">
      <button (click)="loadDemo()" class="preset-pill">Demo</button>
      <button (click)="loadEnterprise()" class="preset-pill preset-highlight">⚡ Enterprise</button>
    </div>
  </div>

  <div class="widget-content space-y-3">
    <div>
      <span class="detail-label">Story / Ticket ID</span>
      <div class="detail-val-mono">{{ state.storyIdSubject | async }}</div>
    </div>

    <div>
      <span class="detail-label">Change Title</span>
      <div class="detail-val-text">{{ state.titleSubject | async }}</div>
    </div>

    <div class="flex items-center justify-between pt-1">
      <div>
        <span class="detail-label">Repository</span>
        <div class="flex items-center gap-1.5 mt-0.5">
          <span class="font-mono text-xs text-slate-200">{{ state.repoLocationSubject | async }}</span>
          <span class="github-badge">GitHub</span>
        </div>
      </div>
      <div>
        <span class="detail-label">Requested by</span>
        <div class="text-xs text-slate-200 font-medium mt-0.5">Kameswar</div>
      </div>
    </div>
  </div>

  <div class="widget-footer">
    <button (click)="run()" [disabled]="(state.isRunning$ | async)" class="btn-primary-gradient w-full py-2.5 flex items-center justify-center gap-2">
      <svg *ngIf="(state.isRunning$ | async)" class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
      <span>{{ (state.isRunning$ | async) ? 'Executing Autonomous Pipeline...' : '⚡ Run Change Request' }}</span>
    </button>
  </div>
</div>
